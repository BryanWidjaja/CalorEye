[project]
name = "caloreye"
version = "0.1.0"
description = "CalorEye food recognition: data pipeline, training and ExecuTorch export"
authors = [
    { name = "Bryan Widjaja", email = "crz.github@gmail.com" }
]
requires-python = ">=3.12.3,<3.13"
dependencies = [
    # Export-critical chain, pinned exactly: ExecuTorch 1.5.0 builds against torch 2.14.0
    # (executorch torch_pin.py), and executorch>=1.5 fails at runtime below torch 2.13.
    "torch==2.14.0",
    "torchvision==0.29.0",
    "executorch==1.5.1",
    # The export-executorch extra carries Ultralytics' numpy<=2.3.5 cap for ExecuTorch export.
    "ultralytics[export-executorch]==8.4.154",
    "timm==1.0.29",
    # Ultralytics' CLIP fork: SAM 3 imports it, and Ultralytics would otherwise pip-install it at runtime.
    "clip",
    "huggingface-hub>=1.31.0",
    "polars>=1.44.2",
    "pycocotools>=2.0.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

# CUDA 12.6 wheels on Windows/Linux: runs on the local RTX 4060 and on older
# cloud drivers (Kaggle/Colab T4) that the CUDA 13.x builds would reject.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "a13192f8cb767260d7dfd98c843b0716593169e7" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
caloreye = "caloreye.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ERA", "C90", "PLR0913", "PLR2004", "T20", "SLF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"src/caloreye/cli.py" = ["T201"]
"tests/*" = ["PLR2004", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
